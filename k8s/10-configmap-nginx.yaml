apiVersion: v1
kind: ConfigMap
metadata:
  name: otto-nginx
  namespace: otto
  labels:
    app.kubernetes.io/name: otto
data:
  default.conf: |
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Uploaded over SFTP into <chroot>/public - same directory, read-only here.
        root /srv/site/public;
        index index.html index.htm;

        charset utf-8;
        absolute_redirect off;

        # Traefik terminates TLS and passes the original scheme through. Without
        # this, a plain http:// request gets Traefik's 404 (the router is bound to
        # the websecure entrypoint), which looks like the site is broken.
        #
        # Done here rather than with a Traefik Middleware on purpose: that needs a
        # CRD whose API group differs between Traefik v2 and v3, whereas this works
        # on either. The health probes reach nginx directly and send no
        # X-Forwarded-Proto, so they never redirect.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/javascript application/javascript
                   application/json image/svg+xml application/xml;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Never serve dotfiles that end up in the upload directory
        # (.git, .env, editor backups, macOS cruft).
        location ~ /\. {
            deny all;
        }

        location ~* \.(css|js|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
